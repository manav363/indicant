[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "indicant"
version = "0.1.0"
description = "Quantitative ML system for Indian stock market regime detection and long-term prediction"
readme = "README.md"
requires-python = ">=3.11"   # tested on 3.13
license = { text = "MIT" }

dependencies = [
    # --- Data ---
    "yfinance>=0.2.40",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",   # for screener.in scraping

    # --- ML (libraries on top of scratch implementations) ---
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "scipy>=1.13.0",

    # --- Experiment tracking ---
    "mlflow>=2.13.0",

    # --- API ---
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",

    # --- Observability ---
    "structlog>=24.1.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",            # for TestClient
    "ruff>=0.4.0",              # linting + formatting
    "mypy>=1.10.0",             # type checking
    "pandas-stubs>=2.2.0",
]

[project.scripts]
indicant = "market_regime.pipeline:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["market_regime*"]

# ── Ruff (linter + formatter) ──────────────────────────────────────────────
[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "TCH"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["market_regime"]

# ── Mypy ──────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

# ── Pytest ────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=market_regime --cov-report=term-missing --cov-fail-under=60"

[tool.coverage.run]
omit = [
    "market_regime/api/*",
    "market_regime/pipeline.py",
    "market_regime/data/universe.py",
]
