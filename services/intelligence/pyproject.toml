[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "indicant-intelligence"
version = "2.0.0"
description = "Panel construction, features, labelling, the layered model stack, calibration and validation."
requires-python = ">=3.11"
dependencies = [
    "indicant-contracts",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=17.0",
    "duckdb>=1.1",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "scipy>=1.14",
    "lightgbm>=4.5",
    "shap>=0.46",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
indicant-ml = "intelligence.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/intelligence"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=intelligence --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
omit = ["*/cli.py", "*/api/*"]
