[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "indicant-intelligence"
version = "2.0.0"
description = "Panel construction, features, labelling, the layered model stack, calibration and validation."
requires-python = ">=3.11"
dependencies = [
    "indicant-contracts",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=17.0",
    "duckdb>=1.1",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "scipy>=1.14",
    "lightgbm>=4.5",
    "shap>=0.46",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
indicant-ml = "intelligence.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/intelligence"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# `X` for a feature matrix and `y` for a target is sklearn's own API convention
# and universal in ML code. Renaming to satisfy pep8-naming would make these
# modules LESS readable to anyone who knows the field.
"src/intelligence/models/*.py" = ["N803", "N806"]
"src/intelligence/explain/*.py" = ["N803", "N806"]
"src/intelligence/validation/walk_forward.py" = ["E501", "N803", "N806", "RUF001", "RUF002", "SIM", "UP"]
"src/intelligence/validation/*.py" = ["N803", "N806"]
# Ported v1 code. Style-cleaning 3,000 lines of already-tested logic during a
# port is how a move becomes a rewrite and a regression sneaks in. Frozen as-is;
# these relax only where v1 differs from the v2 house style.
"src/intelligence/features/technical.py" = ["E501", "N803", "N806", "RUF001", "RUF002", "RUF003", "SIM"]
"src/intelligence/models/linear_scratch.py" = ["E501", "RUF001", "RUF002", "RUF003", "SIM", "UP", "B"]
"src/intelligence/models/boosted.py" = ["E501", "N814", "RUF001", "RUF002", "RUF003", "SIM", "UP", "B"]
"src/intelligence/models/signals.py" = ["E501", "RUF001", "RUF002", "SIM", "UP"]
"src/intelligence/models/sizing.py" = ["E501", "RUF001", "RUF002", "SIM", "UP"]
"src/intelligence/models/base.py" = ["E501", "RUF001", "RUF002", "SIM", "UP", "B"]
"src/intelligence/regime/classifier.py" = ["E501", "RUF001", "RUF002", "RUF012", "SIM", "UP", "B"]
"src/intelligence/regime/market.py" = ["E501", "RUF001", "RUF002", "SIM", "UP"]
"src/intelligence/backtest/*.py" = ["E501", "N803", "N806", "RUF001", "RUF002", "SIM", "UP", "B"]
"src/intelligence/registry/*.py" = ["E501", "RUF001", "RUF002", "RUF005", "SIM", "UP"]
"src/intelligence/data/preprocessor.py" = ["E501", "RUF001", "RUF002", "SIM", "UP"]
"tests/*.py" = ["E501", "N802", "N803", "N806", "F841", "RUF001", "RUF002", "RUF005", "RUF012", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=intelligence --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
omit = ["*/cli.py", "*/api/*"]
