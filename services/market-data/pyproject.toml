[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "indicant-market-data"
version = "2.0.0"
description = "Ingests, validates, adjusts and serves NSE market data. Single writer to the lake."
requires-python = ">=3.11"
dependencies = [
    "indicant-contracts",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "duckdb>=1.1",
    "requests>=2.32",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs",
    "types-requests",
]

[project.scripts]
indicant-md = "market_data.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/market_data"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's documented idiom is a Depends/Query call in the default.
"src/market_data/api/*.py" = ["B008"]
# `rules as R` keeps 60 adversarial-fixture assertions readable.
"tests/*.py" = ["N812"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=market_data --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
omit = ["*/cli.py", "*/api/*"]
