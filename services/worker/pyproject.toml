[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "indicant-worker"
version = "2.0.0"
description = "Scheduled jobs: nightly ingest, weekly retrain, drift detection."
requires-python = ">=3.11"
dependencies = [
    "indicant-contracts",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "apscheduler>=3.10",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
indicant-worker = "worker.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]

[tool.ruff]
line-length = 100
# `src` is declared explicitly so first-party classification does not depend on
# what happens to be installed in the environment. Without it, ruff called
# `intelligence` first-party in a working tree with the packages pip-installed
# and third-party in a fresh CI checkout — so import-sort results differed
# between a developer machine and CI, and lint failed only on the server.
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
