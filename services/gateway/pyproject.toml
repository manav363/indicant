[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "indicant-gateway"
version = "2.0.0"
description = "The only publicly exposed service. Composes market-data and intelligence, renders plain language."
requires-python = ">=3.11"
dependencies = [
    "indicant-contracts",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]


[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
