[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "indicant-gateway"
version = "2.0.0"
description = "The only publicly exposed service. Composes market-data and intelligence, renders plain language."
requires-python = ">=3.11"
dependencies = [
    "indicant-contracts",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]


[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]

[tool.ruff]
line-length = 100
# `src` is declared explicitly so first-party classification does not depend on
# what happens to be installed in the environment. Without it, ruff called
# `intelligence` first-party in a working tree with the packages pip-installed
# and third-party in a fresh CI checkout — so import-sort results differed
# between a developer machine and CI, and lint failed only on the server.
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# copy.py holds the sentences the product shows. Wrapping them to satisfy a
# line-length rule would split strings across lines and make the copy harder to
# read and review than the code around it.
"src/gateway/narrative/copy.py" = ["E501", "RUF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=gateway --cov-report=term-missing --cov-fail-under=85"
asyncio_mode = "auto"

[tool.coverage.run]
omit = ["*/api/*"]
