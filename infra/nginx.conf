# Only the gateway is reachable.
#
# market-data and intelligence have no server block here at all — they are on
# the internal Compose network and nothing routes to them. That is deliberate:
# market-data exposes /internal/quality/* and intelligence would serve raw model
# output, and neither should be one misconfigured location block away from the
# public internet.

upstream indicant_gateway {
    server gateway:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # The ML pipeline is not a secret, but its shape need not be advertised.
    server_tokens off;

    include /etc/nginx/security-headers.conf;

    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # ---- SPA -----------------------------------------------------------
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed bundles are immutable; index.html must never be, or a deploy is
    # invisible until every cache expires.
    location ~* \.(js|css|woff2|svg|png|jpg|avif)$ {
        # The include is REQUIRED: declaring add_header here drops every
        # inherited one. See security-headers.conf.
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # ---- API -----------------------------------------------------------
    location /api/ {
        proxy_pass         http://indicant_gateway;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # A cold prediction reads a panel and runs a stack. Generous, but
        # bounded — an unbounded timeout turns one slow request into a stuck
        # worker.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location = /health {
        proxy_pass http://indicant_gateway/health;
        access_log off;
    }

    # Internal diagnostics are never public. market-data's /internal/quality/*
    # is reachable only from inside the Compose network.
    location /internal/ {
        return 404;
    }
}
