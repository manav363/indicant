# Only the gateway is reachable.
#
# market-data and intelligence have no server block here at all — they are on
# the internal Compose network and nothing routes to them. That is deliberate:
# market-data exposes /internal/quality/* and intelligence would serve raw model
# output, and neither should be one misconfigured location block away from the
# public internet.

upstream indicant_gateway {
    server gateway:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # The ML pipeline is not a secret, but its shape need not be advertised.
    server_tokens off;

    add_header X-Content-Type-Options    "nosniff"                          always;
    add_header X-Frame-Options           "DENY"                             always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"  always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

    # No inline scripts and no external hosts. The frontend bundles everything,
    # so this can stay strict rather than being widened for a CDN.
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"
        always;

    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # ---- SPA -----------------------------------------------------------
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed bundles are immutable; index.html must never be, or a deploy is
    # invisible until every cache expires.
    location ~* \.(js|css|woff2|svg|png|jpg|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # ---- API -----------------------------------------------------------
    location /api/ {
        proxy_pass         http://indicant_gateway;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # A cold prediction reads a panel and runs a stack. Generous, but
        # bounded — an unbounded timeout turns one slow request into a stuck
        # worker.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location = /health {
        proxy_pass http://indicant_gateway/health;
        access_log off;
    }

    # Internal diagnostics are never public. market-data's /internal/quality/*
    # is reachable only from inside the Compose network.
    location /internal/ {
        return 404;
    }
}
