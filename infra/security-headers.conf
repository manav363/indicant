# Security headers, in an includable snippet.
#
# This is a file rather than a block in the server{} because nginx's add_header
# does NOT merge: a location that declares any add_header of its own DROPS every
# add_header inherited from its parent. Two locations here set Cache-Control,
# and `try_files $uri $uri/ /index.html` internally re-routes to one of them —
# so the CSP, X-Frame-Options, nosniff and Referrer-Policy were absent from
# every single response, including the HTML document, which is precisely where
# a CSP does its work. Verified with `curl -D -`: zero security headers on /,
# /index.html, /assets/*.css and an unknown route.
#
# Anywhere a location adds a header, it must include this file too.

add_header X-Content-Type-Options    "nosniff"                                   always;
add_header X-Frame-Options           "DENY"                                      always;
add_header Referrer-Policy           "strict-origin-when-cross-origin"           always;
add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()"  always;

# No inline scripts and no external hosts. The frontend bundles everything —
# including the fonts, which are self-hosted via @fontsource precisely so that
# font-src can stay 'self' rather than being widened for a CDN.
add_header Content-Security-Policy
    "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"
    always;
