# Indicant v2 — four services, one shared lake volume.
#
# The lake is a named volume mounted read-write into market-data (the single
# writer) and READ-ONLY into intelligence. That is the data-plane boundary
# expressed in infrastructure rather than in a code review comment: intelligence
# cannot write to the lake even if someone adds a write call.
#
# Only the gateway is published to the host. market-data and intelligence are
# reachable only on the internal network.

name: indicant

services:
  market-data:
    build:
      context: ..
      dockerfile: services/market-data/Dockerfile
    environment:
      INDICANT_LAKE_ROOT: /data
      INDICANT_HTTP_TIMEOUT: "30"
      INDICANT_MAX_RETRIES: "3"
      # Polite by default. This is a free public archive.
      INDICANT_RATE_LIMIT: "0.35"
    volumes:
      - lake:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  intelligence:
    build:
      context: ..
      dockerfile: services/intelligence/Dockerfile
    environment:
      INDICANT_LAKE_ROOT: /data
    volumes:
      # Read-only. The boundary is enforced by the mount, not by convention.
      - lake:/data:ro
    depends_on:
      market-data:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  gateway:
    build:
      context: ..
      dockerfile: services/gateway/Dockerfile
    environment:
      INDICANT_MARKET_DATA_URL: http://market-data:8000
      INDICANT_INTELLIGENCE_URL: http://intelligence:8000
      INDICANT_CORS_ORIGINS: http://localhost:5173,http://localhost
    ports:
      # The only service published to the host.
      - "8000:8000"
    depends_on:
      market-data:
        condition: service_healthy
      intelligence:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: services/worker/Dockerfile
    environment:
      INDICANT_LAKE_ROOT: /data
      # Off by default: a scheduler that auto-starts everywhere will eventually
      # hammer the NSE archive from someone's laptop.
      INDICANT_WORKER_ENABLED: "false"
    volumes:
      - lake:/data
    depends_on:
      market-data:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  lake:
