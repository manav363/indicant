

services:

  # ── Backend: FastAPI + ML pipeline ──────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: indicant-backend
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - LOG_LEVEL=INFO
      - ALLOWED_ORIGINS=http://localhost
      - CONFIDENCE_THRESHOLD=0.55
      - LOOKBACK_YEARS=5
      - CACHE_DIR=/app/data/cache
      - CACHE_TTL_HOURS=24
      - MLFLOW_TRACKING_URI=/app/experiments/mlruns
    volumes:
      - backend_cache:/app/data/cache
      - backend_mlflow:/app/experiments/mlruns
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - indicant

  # ── Frontend: React + nginx ──────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: indicant-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - indicant

volumes:
  backend_cache:
  backend_mlflow:

networks:
  indicant:
    driver: bridge
