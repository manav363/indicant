name: Nightly Validation

on:
  schedule:
    - cron: '0 6 * * 1-5'   # 6 AM UTC, Mon-Fri (during Indian market hours)
  workflow_dispatch:          # manual trigger for debugging

jobs:
  validate:
    name: Fresh-data ML pipeline
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"

      - name: Run full ML pipeline on fresh data
        run: |
          python -c "
          from market_regime.pipeline import run_single;
          result = run_single('RELIANCE.NS', horizon_months=6);
          print(f'Signal: {result.signal}, Confidence: {result.confidence}');
          "

      - name: Screener smoke test
        run: |
          python -c "
          from market_regime.pipeline import run_screen;
          results = run_screen(index='NIFTY50', horizon_months=6, top_n=5);
          print(f'Screened {len(results)} tickers');
          for r in results[:3]:
              print(f'  {r.ticker}: {r.signal} ({r.confidence:.2f})');
          "

      - name: Check indicator drift
        run: python scripts/check_indicator_drift.py

      - name: Cached baseline for next run
        uses: actions/upload-artifact@v4
        with:
          name: nightly-baselines
          path: scripts/.baselines/
          retention-days: 14
          if-no-files-found: warn
