name: CI

# One workflow for the whole repo. The three v1 workflows (backend, frontend,
# nightly) all pointed at directories that no longer exist and would have failed
# on every push.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Services + contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          pip install --upgrade pip setuptools wheel
          # contracts first — every service depends on it.
          pip install -e packages/contracts
          for svc in market-data intelligence gateway worker; do
            pip install -e "services/$svc[dev]"
          done

      - name: Lint
        run: ruff check packages services

      - name: Test
        run: pytest packages services --no-cov -q

      - name: Verify every service imports
        # A service whose module fails to import passes its own unit tests and
        # then crash-loops in the container. Cheapest possible catch.
        run: |
          python -c "from market_data.api.main import app; print('market-data')"
          python -c "from intelligence.api.main import app; print('intelligence')"
          python -c "from gateway.api.main import app; print('gateway')"

  web:
    name: Terminal
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  images:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Builds only. Running the stack needs a lake, which is gitignored.
      - name: Build all images
        run: docker compose -f infra/docker-compose.yml build
