name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"

jobs:
  lint-and-test:
    name: Lint + Type Check + Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check market_regime/

      - name: Format check
        run: ruff format --check market_regime/

      - name: Type check (non-blocking)
        run: mypy market_regime/ --ignore-missing-imports
        continue-on-error: true

      - name: Run tests
        run: pytest tests/ -v --tb=short --cov=market_regime --cov-report=term-missing

      - name: Verify API imports
        run: |
          python -c "from market_regime.api.main import app; print('✓ API')"
          python -c "from market_regime.data.fetcher import fetch_ohlcv; print('✓ Fetcher')"
          python -c "from market_regime.features.technical import add_all_features; print('✓ Features')"
          python -c "from market_regime.models.gradient_boost import GradientBoostModel; print('✓ Model')"
          python -c "from market_regime.pipeline import run_single; print('✓ Pipeline')"
          python -c "from market_regime.signals.generator import generate_signal; print('✓ Signals')"
          python -c "from market_regime.risk.sizing import recommended_position; print('✓ Risk')"
